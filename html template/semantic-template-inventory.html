<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Sidebar</title>

<style>
:root{
  --dark:#0f172a;
  --dark2:#1e293b;
  --primary:#3b82f6;
  --light:#f1f5f9;
  --white:#fff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:var(--light);
}

.wrapper{
  display:flex;
  min-height:100vh;
}

/* ===== Sidebar ===== */
nav{
  width:260px;
  background:var(--dark);
  color:white;
  padding:20px;
  position:fixed;
  height:100%;
  left:0;
  top:0;
  transition:0.3s;
}

nav h2{
  margin-bottom:20px;
}

/* Menu links */
.menu a,
.dropdown-btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px;
  color:white;
  text-decoration:none;
  cursor:pointer;
  border-radius:6px;
  transition:.2s;
}

.menu a:hover,
.dropdown-btn:hover{
  background:var(--dark2);
}

/* Active link */
.menu a.active{
  background:var(--primary);
}

/* Dropdown */
.dropdown-container{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.4s ease;
  padding-left:10px;
}

.dropdown-container a{
  font-size:14px;
}

/* Rotate arrow */
.dropdown-btn .arrow{
  transition:transform 0.3s;
}

.dropdown-btn.active .arrow{
  transform:rotate(90deg);
}

/* ===== Content ===== */
.content{
  margin-left:260px;
  flex:1;
  transition:.3s;
}

header{
  background:var(--white);
  padding:15px 20px;
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
  display:none;
}

main{
  padding:25px;
}

/* Overlay */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
}

/* ===== Tablet ===== */
@media(max-width:992px){

  nav{
    width:70px;
  }

  nav h2,
  .menu span,
  .dropdown-btn span{
    display:none;
  }

  .content{
    margin-left:70px;
  }
}

/* ===== Mobile ===== */
@media(max-width:768px){

  nav{
    left:-260px;
  }

  nav.active{
    left:0;
  }

  .content{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .overlay.active{
    display:block;
  }
}

</style>
</head>
<body>

<div class="wrapper">

<!-- Sidebar -->
<nav id="sidebar">
  <h2>Inventory</h2>

  <div class="menu">
    <a href="dashboard.html" class="active">📊 <span>Dashboard</span></a>

    <div class="dropdown-btn">
      📦 <span>Products</span>
      <span class="arrow">▶</span>
    </div>

    <div class="dropdown-container">
      <a href="products.html">All Products</a>
      <a href="add-product.html">Add Product</a>
    </div>

    <a href="orders.html">🛒 <span>Orders</span></a>
    <a href="reports.html">📈 <span>Reports</span></a>
  </div>
</nav>

<div class="overlay" id="overlay"></div>

<!-- Content -->
<div class="content">

<header>
  <div class="menu-btn" onclick="toggleSidebar()">☰</div>
  <h1>Advanced Sidebar Demo</h1>
</header>

<main>
  <section>
    <h2>Dashboard Content</h2>
    <p>This sidebar includes active highlight and smooth accordion animation.</p>
  </section>
</main>

</div>
</div>

<script>

/* Mobile Toggle */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('overlay').classList.toggle('active');
}

document.getElementById('overlay').onclick = toggleSidebar;


/* Smooth Accordion */
const dropdownBtn = document.querySelector(".dropdown-btn");
const dropdownContainer = document.querySelector(".dropdown-container");

dropdownBtn.addEventListener("click", function(){
  this.classList.toggle("active");

  if(dropdownContainer.style.maxHeight){
    dropdownContainer.style.maxHeight = null;
  } else {
    dropdownContainer.style.maxHeight = dropdownContainer.scrollHeight + "px";
  }
});


/* Auto Active Based on URL (Production Style) */
const links = document.querySelectorAll(".menu a");
const currentPage = window.location.pathname.split("/").pop();

links.forEach(link=>{
  if(link.getAttribute("href") === currentPage){
    link.classList.add("active");

    // If inside dropdown → auto open
    if(link.parentElement.classList.contains("dropdown-container")){
      dropdownContainer.style.maxHeight = dropdownContainer.scrollHeight + "px";
      dropdownBtn.classList.add("active");
    }
  }
});

</script>

</body>
</html>
