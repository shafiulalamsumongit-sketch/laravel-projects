<!DOCTYPE html>
<html lang="en" x-data="{sidebar:true, dark:false, notify:false}">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tailwind Alpine Admin</title>

<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>

<body :class="dark ? 'bg-gray-900 text-white' : 'bg-gray-100'">

<div class="flex h-screen">

<!-- SIDEBAR -->

<aside 
:class="sidebar ? 'w-64' : 'w-20'"
class="bg-gray-800 text-white transition-all duration-300 flex flex-col">

<div class="p-4 text-xl font-bold">
Admin
</div>

<nav class="flex-1">

<a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-700">
<span>🏠</span>
<span x-show="sidebar">Dashboard</span>
</a>

<a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-700">
<span>📦</span>
<span x-show="sidebar">Products</span>
</a>

<a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-700">
<span>🧾</span>
<span x-show="sidebar">Orders</span>
</a>

<!-- DROPDOWN -->

<div x-data="{open:false}">

<button 
@click="open=!open"
class="flex w-full items-center gap-3 p-3 hover:bg-gray-700">

<span>⚙️</span>
<span x-show="sidebar">Settings</span>

</button>

<div x-show="open" x-transition class="pl-8">

<a href="#" class="block p-2 hover:text-blue-400">Profile</a>
<a href="#" class="block p-2 hover:text-blue-400">Security</a>

</div>

</div>

</nav>

</aside>


<!-- MAIN AREA -->

<div class="flex-1 flex flex-col">

<!-- TOPBAR -->

<header class="bg-white shadow p-4 flex justify-between items-center">

<div class="flex items-center gap-4">

<button 
@click="sidebar=!sidebar"
class="text-xl">
☰
</button>

<h2 class="font-bold text-lg">Dashboard</h2>

</div>

<div class="flex items-center gap-4">

<!-- DARK MODE -->

<button @click="dark=!dark">
🌙
</button>

<!-- NOTIFICATIONS -->

<div class="relative">

<button @click="notify=!notify">
🔔
</button>

<div 
x-show="notify"
@click.outside="notify=false"
class="absolute right-0 mt-2 w-60 bg-white shadow rounded p-3 text-black">

<p class="text-sm">New Order Received</p>
<p class="text-sm">New User Registered</p>

</div>

</div>

</div>

</header>


<!-- CONTENT -->

<main class="p-6 grid md:grid-cols-3 gap-6">

<!-- CARD -->

<div class="bg-white p-6 rounded shadow">

<h3 class="text-gray-500">Total Users</h3>

<p class="text-2xl font-bold">1,245</p>

</div>

<div class="bg-white p-6 rounded shadow">

<h3 class="text-gray-500">Orders</h3>

<p class="text-2xl font-bold">356</p>

</div>

<div class="bg-white p-6 rounded shadow">

<h3 class="text-gray-500">Revenue</h3>

<p class="text-2xl font-bold">$8,420</p>

</div>

</main>

</div>

</div>

</body>
</html>
